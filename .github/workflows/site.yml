name: Test and deploy reading practice

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run reading exercise regression tests
        run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html unit2-textb.html _site/
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published worksheets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, pathlib, time, urllib.request
          base = os.environ['PAGES_URL'].rstrip('/') + '/'
          for filename in ['index.html', 'unit2-textb.html']:
              expected = (pathlib.Path('_site') / filename).read_bytes()
              url = base + filename + '?v=' + os.environ['GITHUB_SHA']
              for attempt in range(6):
                  try:
                      request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          actual = response.read()
                          assert response.status == 200
                      assert actual == expected, 'Published content does not match this deployment'
                      print(f'Verified public {filename}: HTTP 200; content matches deployed source')
                      break
                  except Exception as error:
                      if attempt == 5:
                          raise
                      print(f'{filename}: waiting for Pages propagation ({type(error).__name__})')
                      time.sleep(10)
          PY
